name: Check Username Match

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '対象アプリID（カンマ区切り）'
        required: false
        default: '42,231'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check username match (read-only, no password output)
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          TEMP_ADMIN_USERNAME: ${{ secrets.TEMP_ADMIN_USERNAME }}
          TEMP_ADMIN_PASSWORD: ${{ secrets.TEMP_ADMIN_PASSWORD }}
        run: node scripts/99e_check_username_match.js --apps="${{ inputs.apps }}"
