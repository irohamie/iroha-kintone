name: List Apps

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  list-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run list apps
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
        run: node scripts/02_list_apps.js

      - name: Commit config/apps.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/apps.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "アプリ一覧を更新（Phase 1 自動実行）"
            git push
          fi
