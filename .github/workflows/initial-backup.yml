name: Initial Backup

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  initial-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull JS/CSS code
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
        run: node scripts/03_pull_all.js

      - name: Pull app settings
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
        run: node scripts/08_pull_app_settings.js

      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Phase 2：初回バックアップ（7アプリのJS/CSSとアプリ設定）"
            git push
          fi
