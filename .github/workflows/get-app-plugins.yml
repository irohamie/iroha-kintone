name: Get App Plugins

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '対象アプリID（カンマ区切り）'
        required: false
        default: '154'

permissions:
  contents: read

jobs:
  get-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get app plugins (read-only)
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
        run: node scripts/99m_get_app_plugins.js --apps="${{ inputs.apps }}"
