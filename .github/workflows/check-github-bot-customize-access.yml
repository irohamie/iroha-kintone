name: Check GitHub Bot Customize Access

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '対象アプリID（カンマ区切り）'
        required: false
        default: '42,231,154'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check github-bot customize.json access (read-only)
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
        run: node scripts/99o_check_github_bot_customize_access.js --apps="${{ inputs.apps }}"
