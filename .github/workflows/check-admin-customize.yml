name: Check Admin Customize Access

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '対象アプリID（カンマ区切り）'
        required: false
        default: '231'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check TEMP_ADMIN customize.json access (read-only)
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          TEMP_ADMIN_USERNAME: ${{ secrets.TEMP_ADMIN_USERNAME }}
          TEMP_ADMIN_PASSWORD: ${{ secrets.TEMP_ADMIN_PASSWORD }}
        run: node scripts/99f_check_admin_customize.js --apps="${{ inputs.apps }}"
